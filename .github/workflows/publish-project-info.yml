name: Publish project-info posts
# Runs hourly; publish_next.py assigns fixed 09:00 and 20:00 Vietnam-time (ICT) slots and hides posts until then (publishAt).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-project-info
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: drafts
          path: dr
      - name: Publish next posts
        run: python3 dr/drafts/publish_next.py main dr/drafts
      - name: Commit and push
        working-directory: main
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish scheduled project-info posts"
            git push origin main
          else
            echo "Nothing to publish"
          fi
